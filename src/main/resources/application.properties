#Server configuration
server.servlet.context-path=/tpFoyer17
server.port=8082
### DATABASE ###
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tpFoyer17?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
### MONITORING ###
# Only health and the metrics for Prometheus: /tpFoyer17/actuator/health and /tpFoyer17/actuator/prometheus
# (blocked from Internet by the Nginx of the front, read inside the cluster by Prometheus)
management.endpoints.web.exposure.include=health,prometheus
# Label added to every metric, to filter the application in Grafana
management.metrics.tags.application=tpfoyer
