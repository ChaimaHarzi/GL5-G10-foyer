### DATABASE (tests: H2 in-memory, no MySQL needed) ###
spring.datasource.url=jdbc:h2:mem:tpFoyer17Test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
### JPA / HIBERNATE ###
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
### MONITORING (same as src/main/resources/application.properties, which this file replaces in tests) ###
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=tpfoyer
