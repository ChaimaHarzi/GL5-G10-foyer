<header class="topbar">
  <a routerLink="/" class="brand">tpFoyer</a>
  <nav aria-label="Navigation principale">
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.path === '/' }">
        {{ link.label }}
      </a>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>
