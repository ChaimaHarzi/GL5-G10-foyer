<div class="app" [class.menu-ouvert]="menuOuvert()">
  <aside class="sidebar">
    <a class="marque" routerLink="/">
      <span class="marque-logo"><app-icon nom="home" [taille]="20" /></span>
      <span>tpFoyer<small>Gestion des foyers</small></span>
    </a>

    <p class="nav-section">Gestion</p>
    <nav aria-label="Navigation principale">
      @for (entree of menu; track entree.libelle) {
        @if (entree.lien) {
          <a class="nav-lien" [routerLink]="entree.lien" routerLinkActive="actif" (click)="menuOuvert.set(false)">
            <app-icon [nom]="entree.icone" />
            <span>{{ entree.libelle }}</span>
          </a>
        } @else {
          <span class="nav-lien desactive" aria-disabled="true">
            <app-icon [nom]="entree.icone" />
            <span>{{ entree.libelle }}</span>
            <span class="bientot">bientôt</span>
          </span>
        }
      }
    </nav>

    <div class="sidebar-pied">
      <strong><span class="point-vert"></span>En ligne</strong>
      Spring Boot · Angular · AWS EKS
    </div>
  </aside>

  <div class="voile-menu" (click)="menuOuvert.set(false)"></div>

  <div class="contenu">
    <header class="topbar">
      <button type="button" class="btn-icone menu-mobile" aria-label="Ouvrir le menu" (click)="menuOuvert.set(true)">
        <app-icon nom="menu" />
      </button>
      <nav class="fil" aria-label="Fil d'Ariane">
        <span>tpFoyer</span>
        @if (titrePage()) {
          <span>/</span>
          <strong>{{ titrePage() }}</strong>
        }
      </nav>
    </header>

    <main class="principal">
      <router-outlet />
    </main>
  </div>

  <app-toasts />
</div>
