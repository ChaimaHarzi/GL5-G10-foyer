# Tells Prometheus (installed by Ansible, namespace "monitoring") to read the metrics of the back.
# ServiceMonitor is a type added by the kube-prometheus-stack chart: Ansible installs the chart before ArgoCD.
# Prometheus finds the pods behind the Service "tpfoyer" and reads each of them every 30 seconds.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tpfoyer
  namespace: tpfoyer
  labels:
    app: tpfoyer
  annotations:
    argocd.argoproj.io/sync-wave: "1" # with the back
spec:
  selector:
    matchLabels:
      app: tpfoyer
  endpoints:
    - port: http
      path: /tpFoyer17/actuator/prometheus
      interval: 30s
