# The tpFoyer API (Spring Boot): 2 pods behind an internal Service, reached through the front (k8s/front.yaml).
# The image tpfoyer-back is replaced by Kustomize with the image of the build (k8s/kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer
  namespace: tpfoyer
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after MySQL
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # start 1 new pod at a time...
      maxUnavailable: 0 # ...and never stop an old pod before a new one is ready
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      containers:
        - name: tpfoyer
          image: tpfoyer-back
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/tpFoyer17?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=UTC
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          startupProbe: # gives Spring Boot up to 3 minutes to start
            httpGet:
              path: /tpFoyer17/api/universites/getAll
              port: 8082
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe: # receives traffic only when the API and the database answer
            httpGet:
              path: /tpFoyer17/api/universites/getAll
              port: 8082
            periodSeconds: 10
          livenessProbe: # restarted if the process stops answering
            tcpSocket:
              port: 8082
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
---
# Internal only (ClusterIP): the Nginx pods of the front call http://tpfoyer:8082.
# The API and Swagger are reached from Internet through the load balancer of the front.
# The label and the port name are used by the ServiceMonitor (k8s/servicemonitor.yaml) to find the pods to scrape.
apiVersion: v1
kind: Service
metadata:
  name: tpfoyer
  namespace: tpfoyer
  labels:
    app: tpfoyer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: tpfoyer
  ports:
    - name: http
      port: 8082
      targetPort: 8082
