# The Angular frontend: 2 Nginx pods behind the public AWS load balancer.
# Nginx serves the Angular files and forwards /tpFoyer17/ (the API and Swagger) to the backend Service "tpfoyer".
# __FRONTEND_IMAGE__ is replaced by Jenkins with the image of the build (e.g. fourat10/tpfoyer-frontend:33).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer-frontend
  namespace: tpfoyer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # start 1 new pod at a time...
      maxUnavailable: 0 # ...and never stop an old pod before a new one is ready
  template:
    metadata:
      labels:
        app: tpfoyer-frontend
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL # where Nginx forwards /tpFoyer17/: the backend Service (port 80 -> 8082)
              value: http://tpfoyer:80
          readinessProbe: # receives traffic only when Nginx answers
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe: # restarted if Nginx stops answering
            tcpSocket:
              port: 80
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Public entry point: AWS creates a load balancer forwarding port 80 to the Nginx pods
apiVersion: v1
kind: Service
metadata:
  name: tpfoyer-frontend
  namespace: tpfoyer
spec:
  type: LoadBalancer
  selector:
    app: tpfoyer-frontend
  ports:
    - port: 80
      targetPort: 80
